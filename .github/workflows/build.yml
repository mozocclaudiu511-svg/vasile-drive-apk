name: Build VASILE DRIVE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install legacy SDK
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3"
          yes | sdkmanager --licenses

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.6-bin.zip
          unzip -q gradle-4.6-bin.zip
          ./gradle-4.6/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VASILE-DRIVE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
