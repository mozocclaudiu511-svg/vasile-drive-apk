
name: Build VASILE DRIVE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-28 build-tools;28.0.3'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.6-bin.zip
          unzip -q gradle-4.6-bin.zip
          gradle-4.6/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VASILE-DRIVE-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
